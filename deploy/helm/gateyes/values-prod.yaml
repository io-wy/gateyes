replicaCount: 3

image:
  tag: latest

serviceAccount:
  create: true
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: gateyes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gateyes-tls
      hosts:
        - gateyes.example.com

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

persistence:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingress:
    fromNamespaces: []
    fromPodSelectors: []
  egress:
    enabled: true
    allowDNS: true
    allowInternet: true

probes:
  startup:
    enabled: true
    path: /health
    failureThreshold: 30
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 15
    failureThreshold: 3

appConfig: |
  server:
    listenAddr: ":8083"
    readTimeout: 30
    writeTimeout: 300
    idleTimeout: 120
    shutdownTimeout: 10

  database:
    driver: postgres
    dsn: ${POSTGRES_DSN}
    autoMigrate: true
    maxOpenConns: 50
    maxIdleConns: 20
    connMaxLifetimeSeconds: 300

  metrics:
    namespace: gateway
    enabled: true

  router:
    strategy: least_load

  limiter:
    globalQPS: 5000
    globalTPM: 5000000
    globalTokenBurst: 500000
    perUserRequestBurst: 200
    queueSize: 5000

  retry:
    maxRetries: 2
    initialDelayMs: 100
    maxDelayMs: 5000
    backoffFactor: 2

  circuitBreaker:
    failureThreshold: 5
    recoveryTimeout: 60
    halfOpenMaxRequests: 1

  providers:
    - name: openai-primary
      type: openai
      baseURL: ${OPENAI_BASE_URL}
      endpoint: responses
      apiKey: ${OPENAI_API_KEY}
      model: ${OPENAI_MODEL}
      maxTokens: 16384
      timeout: 60
      enabled: true

    - name: anthropic-primary
      type: anthropic
      baseURL: ${ANTHROPIC_BASE_URL}
      apiKey: ${ANTHROPIC_API_KEY}
      model: ${ANTHROPIC_MODEL}
      maxTokens: 16384
      timeout: 60
      enabled: true

  apiKeys:
    - key: ${GATEYES_BOOTSTRAP_TEST_KEY}
      secret: ${GATEYES_BOOTSTRAP_TEST_SECRET}
      quota: 1000000
      qps: 1000
      models: []

  admin:
    defaultTenant: default
    bootstrapKey: ${GATEYES_ADMIN_BOOTSTRAP_KEY}
    bootstrapSecret: ${GATEYES_ADMIN_BOOTSTRAP_SECRET}

monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
  prometheusRule:
    enabled: true
    additionalLabels: {}
    groups:
      - name: gateyes-llm-baseline
        interval: 30s
        rules:
          - alert: GateyesLLMErrorRateHigh
            expr: |
              (
                sum by (surface, provider) (rate(gateway_llm_requests_total{result!="success"}[5m]))
                /
                clamp_min(sum by (surface, provider) (rate(gateway_llm_requests_total[5m])), 0.001)
              ) > 0.10
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes LLM error rate is high"
              description: "surface={{ $labels.surface }} provider={{ $labels.provider }} error rate > 10% for 10m"
          - alert: GateyesLLMRequestLatencyP95High
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, surface, provider) (
                  rate(gateway_llm_request_duration_seconds_bucket[5m])
                )
              ) > 5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes request p95 latency is high"
              description: "surface={{ $labels.surface }} provider={{ $labels.provider }} request p95 > 5s"
          - alert: GateyesLLMUpstreamLatencyP95High
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, surface, provider) (
                  rate(gateway_llm_upstream_duration_seconds_bucket[5m])
                )
              ) > 4
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes upstream p95 latency is high"
              description: "surface={{ $labels.surface }} provider={{ $labels.provider }} upstream p95 > 4s"
          - alert: GateyesLLMTTFTP95High
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, surface, provider) (
                  rate(gateway_llm_time_to_first_token_seconds_bucket[5m])
                )
              ) > 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes TTFT p95 is high"
              description: "surface={{ $labels.surface }} provider={{ $labels.provider }} TTFT p95 > 2s"
          - alert: GateyesLLMStreamDurationP95High
            expr: |
              histogram_quantile(
                0.95,
                sum by (le, surface, provider) (
                  rate(gateway_llm_stream_duration_seconds_bucket[5m])
                )
              ) > 30
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes stream duration p95 is high"
              description: "surface={{ $labels.surface }} provider={{ $labels.provider }} stream duration p95 > 30s"
          - alert: GateyesLLMActiveStreamsSustained
            expr: avg_over_time(gateway_llm_active_streams[10m]) > 20
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes active streams remain high"
              description: "surface={{ $labels.surface }} active streams average > 20 for 10m"
          - alert: GateyesLLMRetryBurst
            expr: increase(gateway_llm_retries_total[10m]) > 20
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes retry burst detected"
              description: "provider={{ $labels.provider }} retries > 20 in 10m"
          - alert: GateyesLLMFallbackBurst
            expr: increase(gateway_llm_fallbacks_total[10m]) > 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Gateyes fallback burst detected"
              description: "provider={{ $labels.provider }} fallbacks > 10 in 10m"
          - alert: GateyesProviderCircuitOpen
            expr: max_over_time(gateway_provider_circuit_state[5m]) >= 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Gateyes provider circuit is open"
              description: "tenant={{ $labels.tenant_id }} provider={{ $labels.provider }} circuit breaker is open or half-open"
  grafanaDashboard:
    enabled: true
    folder: "LLM Gateway"
  otelCollector:
    enabled: false
    endpoint: ""
    insecure: true

{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gateyes.fullname" . }}
  labels:
    {{- include "gateyes.labels" . | nindent 4 }}
rules:
  # Provider CRD permissions for in-process controller-runtime.
  - apiGroups: ["gateway.gateyes.io"]
    resources: ["providers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["gateway.gateyes.io"]
    resources: ["providers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gateway.gateyes.io"]
    resources: ["providers/finalizers"]
    verbs: ["update"]
  # Ingress controller permissions.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["get"]
  # Service discovery and TLS secret permissions.
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gateyes.fullname" . }}
  labels:
    {{- include "gateyes.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gateyes.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gateyes.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}

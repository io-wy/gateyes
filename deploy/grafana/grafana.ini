# Minimal Grafana config for local Gateyes observability.
# Paths are absolute so the server can be started from any working directory.
app_mode = production

[server]
http_port = 3000

[paths]
provisioning = /Users/io/workplace/gateyes/deploy/grafana/provisioning
data = /tmp/grafana-data
logs = /tmp/grafana-logs
plugins = /tmp/grafana-plugins

[security]
# Default admin credentials for local dev only. Change in production.
admin_user = admin
admin_password = admin

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

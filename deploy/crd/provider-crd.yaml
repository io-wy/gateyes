apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: providers.gateway.gateyes.io
spec:
  group: gateway.gateyes.io
  names:
    kind: Provider
    listKind: ProviderList
    plural: providers
    singular: provider
    shortNames:
      - gpv
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                type:
                  type: string
                  enum: [openai, anthropic, grpc, azure]
                vendor:
                  type: string
                baseURL:
                  type: string
                grpcTarget:
                  type: string
                grpcUseTLS:
                  type: boolean
                grpcAuthority:
                  type: string
                apiKey:
                  type: string
                model:
                  type: string
                weight:
                  type: integer
                priceInput:
                  type: number
                priceOutput:
                  type: number
                maxTokens:
                  type: integer
                timeout:
                  type: integer
                enabled:
                  type: boolean
                headers:
                  type: object
                  additionalProperties:
                    type: string
                extraBody:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                endpoint:
                  type: string
                  enum: [chat, responses]
              required:
                - type
            status:
              type: object
              properties:
                ready:
                  type: boolean
                lastSyncTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', 'Unknown']
                      observedGeneration:
                        type: integer
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}

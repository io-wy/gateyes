# Gateyes load-test configuration.
# Points all providers at the local mock upstream so load tests exercise the
# gateway, not real LLM endpoints.
server:
  listenAddr: ":8028"
  readTimeout: 30
  writeTimeout: 300
  idleTimeout: 120
  shutdownTimeout: 10

database:
  driver: postgres
  dsn: "postgres://gateyes:gateyes_pw@localhost:5432/gateyes?sslmode=disable"
  autoMigrate: true
  maxOpenConns: 50
  maxIdleConns: 20
  connMaxLifetimeSeconds: 300

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

metrics:
  namespace: gateway
  enabled: true

router:
  strategy: least_load

limiter:
  globalQPS: 50000
  globalTPM: 50000000
  globalTokenBurst: 5000000
  perUserRequestBurst: 10000
  tenantTPM: 50000000
  tenantTPMBurst: 5000000
  tenantRPM: 50000
  tenantRPMBurst: 5000
  providerTPM: 50000000
  providerTPMBurst: 5000000
  providerRPM: 50000
  providerRPMBurst: 5000
  modelTPM: 50000000
  modelTPMBurst: 5000000
  modelRPM: 50000
  modelRPMBurst: 5000
  queueSize: 10000

retry:
  maxRetries: 2
  initialDelayMs: 100
  maxDelayMs: 5000
  backoffFactor: 2.0

circuitBreaker:
  failureThreshold: 5
  recoveryTimeout: 60
  halfOpenMaxRequests: 1

cache:
  enabled: true
  backend: auto
  defaultTTL: 300
  capacity: 10000
  skipStream: false
  skipTools: true
  singleflight: true
  promptRewrite: true
  semantic:
    enabled: false
    backend: pgvector
    embeddingProvider: mock-embeddings
    embeddingModel: mock-embedding-model
    threshold: 0.92
    maxCandidates: 5
    ttlSeconds: 3600
    writeAsync: true
    allowStream: true
    allowedSurfaces:
      - responses
      - service_responses
    requireServiceOptIn: true

providers:
  - name: mock-openai
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: http://localhost:18080
    apiKey: mock-key
    model: mock-model
    weight: 10
    priceInput: 0.000001
    priceOutput: 0.000001
    maxTokens: 4096
    timeout: 60
    enabled: true
    capabilities:
      embeddings: false

  - name: mock-embeddings
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: http://localhost:18080
    apiKey: mock-key
    model: mock-embedding-model
    weight: 10
    priceInput: 0.000001
    priceOutput: 0
    maxTokens: 4096
    timeout: 60
    enabled: true
    capabilities:
      chat: false
      responses: false
      messages: false
      embeddings: true

  - name: mock-images
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: http://localhost:18080
    apiKey: mock-key
    model: mock-image-model
    weight: 10
    priceInput: 0.000001
    priceOutput: 0.000001
    maxTokens: 4096
    timeout: 60
    enabled: true
    capabilities:
      chat: false
      responses: false
      messages: false
      images: true

apiKeys:
  - key: demo-key-001
    secret: demo-secret
    quota: -1
    qps: 0
    models: []

admin:
  defaultTenant: default
  bootstrapKey: admin-key-001
  bootstrapSecret: admin-secret

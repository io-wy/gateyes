# Gateyes 真实上游配置
server:
  listenAddr: ":8028"
  readTimeout: 30
  writeTimeout: 300
  idleTimeout: 120
  shutdownTimeout: 10

database:
  driver: postgres
  dsn: "host=localhost port=5432 user=gateyes password=gateyes_pw dbname=gateyes sslmode=disable"
  autoMigrate: true
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifetimeSeconds: 300

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

metrics:
  namespace: gateway
  enabled: true

router:
  strategy: least_load
  ranker:
    enabled: false
    method: none
  ruleEngine:
    enabled: false

limiter:
  globalQPS: 1000
  globalTPM: 1000000
  globalTokenBurst: 100000
  perUserRequestBurst: 100
  tenantTPM: 0
  tenantTPMBurst: 0
  tenantRPM: 0
  tenantRPMBurst: 0
  providerTPM: 300000
  providerTPMBurst: 30000
  providerRPM: 600
  providerRPMBurst: 60
  modelTPM: 0
  modelTPMBurst: 0
  modelRPM: 0
  modelRPMBurst: 0
  queueSize: 1000

alert:
  enabled: true
  quotaThreshold: 0.8
  webhookURL: ""
  webhookSecret: ""
  providerStateURL: ""
  budgetExhaustedURL: ""
  requestEventURL: ""
  errorEventURL: ""

healthCheck:
  enabled: true
  intervalSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 2

retry:
  maxRetries: 2
  initialDelayMs: 100
  maxDelayMs: 5000
  backoffFactor: 2.0

circuitBreaker:
  failureThreshold: 5
  recoveryTimeout: 60
  halfOpenMaxRequests: 1

providers:
  - name: kimi-max
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: https://api.kimi.com/coding
    apiKey: sk-kimi-mu3pQu7QOzyLVdZdR2EKr15JAs1MhiDCpKAspQC7P8Re9GsG8OR1jv8Tc4Z13uDt
    model: kimi-for-coding
    weight: 10000
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 1638400000
    timeout: 60
    enabled: true

  - name: longcat-openai
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: https://api.longcat.chat/openai
    apiKey: ak_1so2TW4PC7As4oJ1Qy73C08t1hc2Q
    model: LongCat-Flash-Chat
    weight: 10
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 16384
    timeout: 60
    enabled: true

  - name: longcat-thinking
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: https://api.longcat.chat/openai
    apiKey: ak_1so2TW4PC7As4oJ1Qy73C08t1hc2Q
    model: LongCat-Flash-Thinking-2601
    weight: 10
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 16384

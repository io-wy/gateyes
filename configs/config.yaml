# Gateyes 真实上游配置
server:
  listenAddr: ":8028"
  readTimeout: 30
  writeTimeout: 300
  idleTimeout: 120
  shutdownTimeout: 10
  # tlsCertFile: "/path/to/cert.pem"
  # tlsKeyFile: "/path/to/key.pem"

database:
  driver: postgres
  dsn: "${GATEYES_DATABASE_DSN}"
  autoMigrate: true
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifetimeSeconds: 300

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

metrics:
  namespace: gateway
  enabled: true

router:
  strategy: least_load
  inferenceMetrics:
    enabled: true
    scrapeIntervalSeconds: 5
  ranker:
    enabled: false
    method: none
  ruleEngine:
    enabled: false

limiter:
  globalQPS: 100000
  globalTPM: 100000000
  globalTokenBurst: 100000000
  perUserRequestBurst: 1000
  tenantTPM: 0
  tenantTPMBurst: 0
  tenantRPM: 0
  tenantRPMBurst: 0
  providerTPM: 1000000000
  providerTPMBurst: 100000000
  providerRPM: 1000000
  providerRPMBurst: 100000
  modelTPM: 0
  modelTPMBurst: 0
  modelRPM: 0
  modelRPMBurst: 0
  queueSize: 10000

alert:
  enabled: false
  quotaThreshold: 0.8
  webhookURL: ""
  webhookSecret: ""
  providerStateURL: ""
  budgetExhaustedURL: ""
  requestEventURL: ""
  errorEventURL: ""

healthCheck:
  enabled: false
  intervalSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 100

circuitBreaker:
  failureThreshold: 1000
  recoveryTimeout: 1
  halfOpenMaxRequests: 100

retry:
  maxRetries: 2
  initialDelayMs: 100
  maxDelayMs: 5000
  backoffFactor: 2.0

cache:
  enabled: true
  backend: memory
  defaultTTL: 300
  capacity: 1000
  skipStream: false
  skipTools: true
  singleflight: true

providers:
  - name: codexapis
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: https://www.codexapis.com/v1
    apiKey: ${CODEXAPIS_API_KEY}
    model: gpt-5.4
    weight: 100
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 16384
    timeout: 600
    enabled: true
    capabilities:
      embeddings: false
  - name: codexapis-responses
    type: openai
    vendor: openai
    endpoint: responses
    baseURL: https://www.codexapis.com/v1
    apiKey: ${CODEXAPIS_API_KEY}
    model: gpt-5.4
    weight: 100
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 16384
    timeout: 600
    enabled: true
    capabilities:
      embeddings: false
  - name: deepseek
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: https://api.deepseek.com/v1
    apiKey: ${DEEPSEEK_API_KEY}
    model: deepseek-v4-flash
    weight: 100
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 16384
    timeout: 600
    enabled: true
    capabilities:
      embeddings: false

  # Local vLLM instances for cache-hit experiments.
  # Start them first with:
  #   go run ./cmd/vllm --model Qwen/Qwen3-0.6B --instances 2 --base-port 8001 --enable-prefix-caching
  # Then set enabled: true below and restart gateway.
  - name: vllm-qwen3-0.6B-8001
    type: openai
    vendor: vllm
    endpoint: chat
    baseURL: http://127.0.0.1:8001/v1
    apiKey: sk-vllm-local
    model: Qwen/Qwen3-0.6B
    weight: 100
    maxTokens: 16384
    timeout: 600
    enabled: false
    metricsURL: http://127.0.0.1:8001/metrics
    capabilities:
      chat: true
      stream: true
      embeddings: false
  - name: vllm-qwen3-0.6B-8002
    type: openai
    vendor: vllm
    endpoint: chat
    baseURL: http://127.0.0.1:8002/v1
    apiKey: sk-vllm-local
    model: Qwen/Qwen3-0.6B
    weight: 100
    maxTokens: 16384
    timeout: 600
    enabled: false
    metricsURL: http://127.0.0.1:8002/metrics
    capabilities:
      chat: true
      stream: true
      embeddings: false


apiKeys:
  - key: demo-key-001
    secret: ${GATEYES_DEMO_SECRET}
    quota: -1
    qps: 1000
    models: []

  - key: chat-key-001
    secret: ${GATEYES_CHAT_SECRET}
    quota: 5000000
    qps: 200
    models: []

  - key: session-key-001
    secret: ${GATEYES_SESSION_SECRET}
    quota: 3000000
    qps: 100
    models: []

  - key: agent-key-001
    secret: ${GATEYES_AGENT_SECRET}
    quota: 2000000
    qps: 50
    models: []

  - key: embed-key-001
    secret: ${GATEYES_EMBED_SECRET}
    quota: 1000000
    qps: 100
    models: []

  - key: bad-key-001
    secret: ${GATEYES_BAD_SECRET}
    quota: 1000000
    qps: 50
    models: []

  - key: spike-key-001
    secret: ${GATEYES_SPIKE_SECRET}
    quota: 10000000
    qps: 500
    models: []

admin:
  defaultTenant: default
  bootstrapKey: admin-key-001
  bootstrapSecret: ${GATEYES_ADMIN_BOOTSTRAP_SECRET}

# Guardrails (legacy pre-/post-call validators)
guardrails:
  - name: pii-wasm
    type: wasm
    path: "./plugins/examples/pii_guard/pii_guard.wasm"
    timeoutMs: 500
    memoryPages: 2

# WASM plugin system
# Place .wasm files in the directory; gateway loads them on startup.
plugins:
  enabled: true
  directory: "./plugins"
  autoReload: true
  reloadIntervalSeconds: 30

wasmPlugins:
  - name: wasm-auditor
    path: ./plugins/examples/wasm_auditor/wasm_auditor.wasm
    phases:
      - pre_upstream
      - post_upstream
      - audit
    timeoutMs: 50
    memoryPages: 2
  - name: wasm-transform
    path: ./plugins/examples/wasm_transform/wasm_transform.wasm
    phases:
      - post_upstream
    timeoutMs: 50
    memoryPages: 2

# gRPC plugin system
# Router plugins receive candidate providers and return an ordered list.
grpcPlugins:
  - name: random-router
    type: router
    address: localhost:50051
    timeout: 100

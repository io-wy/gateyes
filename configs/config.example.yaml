# Gateyes 真实上游配置
server:
  listenAddr: ":8028"
  readTimeout: 30
  writeTimeout: 300
  idleTimeout: 120
  shutdownTimeout: 10

database:
  driver: postgres
  dsn: "${GATEYES_DATABASE_DSN}"
  autoMigrate: true
  maxOpenConns: 10
  maxIdleConns: 5
  connMaxLifetimeSeconds: 300

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

metrics:
  namespace: gateway
  enabled: true

router:
  strategy: least_load
  ranker:
    enabled: false
    method: none
  ruleEngine:
    enabled: false

limiter:
  globalQPS: 1000
  globalTPM: 1000000
  globalTokenBurst: 100000
  perUserRequestBurst: 100
  tenantTPM: 500000
  tenantTPMBurst: 50000
  tenantRPM: 1000
  tenantRPMBurst: 100
  providerTPM: 300000
  providerTPMBurst: 30000
  providerRPM: 600
  providerRPMBurst: 60
  modelTPM: 200000
  modelTPMBurst: 20000
  modelRPM: 400
  modelRPMBurst: 40
  queueSize: 1000

alert:
  enabled: true
  quotaThreshold: 0.8
  webhookURL: ""
  webhookSecret: ""
  providerStateURL: ""
  budgetExhaustedURL: ""
  requestEventURL: ""
  errorEventURL: ""
  channels:
    # Example: send critical alerts to a Feishu (Lark) chat via the official SDK.
    # - name: feishu-ops
    #   type: feishu
    #   feishuAppId: ${FEISHU_APP_ID}
    #   feishuAppSecret: ${FEISHU_APP_SECRET}
    #   feishuReceiveType: chat_id
    #   feishuReceiveId: ${FEISHU_CHAT_ID}
    #   feishuMsgType: interactive
    #   labels:
    #     severity: critical

healthCheck:
  enabled: true
  intervalSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 2

retry:
  maxRetries: 2
  initialDelayMs: 100
  maxDelayMs: 5000
  backoffFactor: 2.0

circuitBreaker:
  failureThreshold: 5
  recoveryTimeout: 60
  halfOpenMaxRequests: 1

providers:
  - name: longcat-openai
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: https://api.longcat.chat/openai
    apiKey: ${LONGCAT_API_KEY}
    model: LongCat-Flash-Chat
    weight: 10
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 16384
    timeout: 60
    enabled: true
    capabilities:
      embeddings: false

  - name: longcat-anthropic
    type: anthropic
    vendor: anthropic
    endpoint: chat
    baseURL: https://api.longcat.chat/anthropic
    apiKey: ${LONGCAT_API_KEY}
    model: LongCat-Flash-Chat
    weight: 8
    priceInput: 0.000003
    priceOutput: 0.000015
    maxTokens: 200000
    timeout: 120
    enabled: true
    capabilities:
      embeddings: false

  - name: bigmodel-anthropic
    type: anthropic
    vendor: anthropic
    endpoint: chat
    baseURL: https://open.bigmodel.cn/api/anthropic
    apiKey: ${BIGMODEL_API_KEY}
    model: glm-5.1
    weight: 5
    priceInput: 0.000002
    priceOutput: 0.000008
    maxTokens: 128000
    timeout: 60
    enabled: true
    capabilities:
      embeddings: false

  - name: longcat-openai-alt
    type: openai
    vendor: openai
    endpoint: chat
    baseURL: https://api.longcat.chat/openai
    apiKey: ${LONGCAT_ALT_API_KEY}
    model: LongCat-Flash-Chat
    weight: 5
    priceInput: 0.000005
    priceOutput: 0.000015
    maxTokens: 16384
    timeout: 60
    enabled: true
    capabilities:
      embeddings: false

  - name: deepseek-anthropic
    type: anthropic
    vendor: anthropic
    endpoint: chat
    baseURL: https://api.deepseek.com/anthropic
    apiKey: ${DEEPSEEK_API_KEY}
    model: DeepSeek-V4-Flash
    weight: 3
    priceInput: 0.000001
    priceOutput: 0.000005
    maxTokens: 8192
    timeout: 60
    enabled: true
    capabilities:
      embeddings: false

apiKeys:
  - key: demo-key-001
    secret: ${GATEYES_BOOTSTRAP_TEST_SECRET}
    quota: 1000000
    qps: 1000
    models: []

admin:
  defaultTenant: default
  bootstrapKey: admin-key-001
  bootstrapSecret: ${GATEYES_ADMIN_BOOTSTRAP_SECRET}
